name: Build ORTHOS (Windows)

# Собирает Windows-установщик ОРТОС — планировщик ортогнатической хирургии
# (ТРГ из МСКТ, расстановка точек с подсказками, фото пациента, планирование).
# Готовый .exe — во вкладке Actions → запуск → Artifacts.

on:
  push:
    branches:
      - main
      - claude/amazing-bell-gvc4xo
    paths:
      - 'orthos/**'
      - '.github/workflows/build-orthos.yml'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: orthos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORTHOS-Windows-Installer
          path: orthos/release/*.exe
          if-no-files-found: error
