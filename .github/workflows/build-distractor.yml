name: Build КДА-Актив (Windows)

# Собирает установщик Windows (.exe) приложения КДА-Актив.
# Готовый файл — во вкладке Actions → запуск → Artifacts.

on:
  push:
    branches:
      - main
      - claude/amazing-bell-gvc4xo
    paths:
      - 'distractor/**'
      - '.github/workflows/build-distractor.yml'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: distractor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDA-Activ-Windows-Installer
          path: distractor/dist/*.exe
          if-no-files-found: error
