name: Deploy PWA (GitHub Pages)

# Публикует приложение из папки web/ на GitHub Pages (бесплатный https-хостинг).
# После сборки приложение доступно по постоянной ссылке — её можно открыть
# на iPhone в Safari и добавить «На экран Домой».

on:
  push:
    branches:
      - main
      - claude/amazing-bell-gvc4xo
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
