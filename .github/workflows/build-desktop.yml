name: Build Desktop (Windows)

# Собирает установщик Windows (.exe) на настоящем Windows-сервере GitHub.
# Готовый файл появляется во вкладке Actions → запуск → Artifacts.

on:
  push:
    branches:
      - claude/amazing-bell-gvc4xo
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnalizatorKDO-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
