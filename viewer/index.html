<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КДО-Планировщик 3D</title>
<style>
  :root{
    --void:#081116; --panel:#0e1f27; --panel2:#132a33; --line:#26414b;
    --ink:#dcf5f7; --ink-soft:#8fb3bb; --ink-faint:#5f818b; --accent:#2fe4d6; --accent2:#38a8ff;
    --mono:ui-monospace,'Cascadia Code',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--void);color:var(--ink);font-family:system-ui,'Segoe UI',sans-serif;overflow:hidden;
       display:flex;flex-direction:column}
  /* ── верхняя панель ── */
  .toolbar{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--panel);
           border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.02em}
  .brand .mk{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--panel2);
       border:1px solid var(--line);color:var(--accent);box-shadow:0 0 14px -6px var(--accent)}
  .brand small{font-family:var(--mono);font-size:10px;color:var(--ink-faint);font-weight:400;letter-spacing:.12em}
  button.act{background:var(--accent);color:#04120f;border:none;border-radius:7px;padding:8px 14px;font-weight:650;
       cursor:pointer;font-size:13px}
  button.act:hover{filter:brightness(1.07)}
  .grp{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .grp input[type=range]{width:110px;accent-color:var(--accent)}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--ink-soft);border-radius:6px;
        padding:4px 9px;font-size:11px;font-family:var(--mono);cursor:pointer}
  .chip:hover{color:var(--accent);border-color:var(--accent)}
  .meta{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-align:right;line-height:1.4}
  /* ── прогресс ── */
  .prog{height:3px;background:transparent;opacity:0;transition:opacity .2s}
  .prog>div{height:100%;background:var(--accent);width:0;box-shadow:0 0 8px var(--accent)}
  /* ── сетка вьюпортов ── */
  .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--line);min-height:0}
  .vp{position:relative;background:#000;overflow:hidden;display:flex;flex-direction:column}
  .vp canvas{flex:1;width:100%;height:100%;display:block}
  .vp .sl{position:absolute;left:8px;right:8px;bottom:8px;accent-color:var(--accent);opacity:.8}
  .vp .tag{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:10px;color:var(--ink-faint);
           background:rgba(8,17,22,.6);padding:2px 6px;border-radius:4px;pointer-events:none}
  .vp.threeD{background:#0a1418}
  #dropHint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink-faint);
            font-family:var(--mono);font-size:12px;pointer-events:none}
  #dropHint b{color:var(--accent)}
  .status{position:fixed;bottom:10px;left:16px;font-family:var(--mono);font-size:11px;color:var(--accent);z-index:5}
</style>
</head>
<body>
  <div class="toolbar">
    <div class="brand">
      <span class="mk">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 7v10M20 7v10M8 7v3M12 7v4M16 7v3M4 17h16"/></svg>
      </span>
      <div>КДО-Планировщик&nbsp;3D<br><small>DICOM · MPR · 3D РЕКОНСТРУКЦИЯ</small></div>
    </div>
    <button class="act" id="loadBtn">Загрузить DICOM</button>
    <input type="file" id="fileInput" webkitdirectory directory multiple accept=".dcm,application/dicom" style="display:none">
    <div class="grp" title="Уровень окна (центр)">WC <input type="range" id="wc" min="-1000" max="3000" value="300"><span id="wcval">300</span></div>
    <div class="grp" title="Ширина окна">WW <input type="range" id="ww" min="1" max="4000" value="1500"><span id="wwval">1500</span></div>
    <span class="chip" data-preset="300,1500">Кость</span>
    <span class="chip" data-preset="40,400">Мягкие ткани</span>
    <div class="grp" title="Порог кости для 3D">3D&nbsp;порог <input type="range" id="thr" min="-200" max="1500" value="300"><span id="thrval">300 HU</span></div>
    <div class="meta"><span id="meta">Серия не загружена</span></div>
  </div>
  <div class="prog"><div id="progbar"></div></div>

  <div class="grid">
    <div class="vp"><canvas id="cv-axial" width="600" height="450"></canvas><input class="sl" id="sl-axial" type="range" min="0" max="0" value="0"></div>
    <div class="vp"><canvas id="cv-coronal" width="600" height="450"></canvas><input class="sl" id="sl-coronal" type="range" min="0" max="0" value="0"></div>
    <div class="vp"><canvas id="cv-sagittal" width="600" height="450"></canvas><input class="sl" id="sl-sagittal" type="range" min="0" max="0" value="0"></div>
    <div class="vp threeD"><canvas id="cv-3d"></canvas><span class="tag" id="info3d">3D</span>
      <div id="dropHint">Нажмите <b>«Загрузить DICOM»</b> или перетащите папку с серией сюда<br>Аксиал · Коронар · Сагиттал · 3D-кость</div>
    </div>
  </div>

  <div class="status" id="status"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
