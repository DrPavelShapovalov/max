<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Админка сайта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a calm editing desk in the site's colours. Sections on the left, one form in the middle,
     the real site live on the right. Edits autosave as a draft; "Опубликовать" commits content.json. */
  :root{
    --bg:#070b0c; --panel:#0d1615; --panel-2:#122120; --line:rgba(237,232,222,.11); --line-2:rgba(237,232,222,.2);
    --ink:#ede8de; --mist:#97a49f; --gold:#d6b266; --gold-hi:#f0d48e; --gold-lo:#a77e34; --ok:#7fc8a9; --err:#e98a7a;
    --text:'Manrope','Segoe UI',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--text); -webkit-font-smoothing:antialiased}
  button,input,textarea,select{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .app{display:grid; grid-template-columns:250px minmax(0,1fr) minmax(0,440px); grid-template-rows:auto 1fr; height:100%}
  header{grid-column:1/-1; display:flex; align-items:center; gap:14px; padding:12px 18px;
    padding-top:calc(12px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--line);
    background:rgba(13,22,21,.8); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px)}
  .logo{display:flex; align-items:center; gap:10px; font-weight:800}
  .logo svg{width:26px; height:26px; color:var(--gold)}
  .logo small{font-family:var(--mono); font-weight:400; color:var(--mist); font-size:12px}
  .status{margin-left:auto; font-size:13px; color:var(--mist); display:flex; align-items:center; gap:8px; min-width:0}
  .status i{width:8px; height:8px; border-radius:50%; background:var(--mist); flex:none}
  .status.dirty i{background:var(--gold)} .status.ok i{background:var(--ok)} .status.err i{background:var(--err)}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; border:1px solid var(--line-2);
    background:transparent; cursor:pointer; font-weight:700; font-size:13px; white-space:nowrap}
  .btn:hover{border-color:var(--gold); color:var(--gold-hi)}
  .btn.primary{background:var(--gold); color:#140f06; border-color:transparent}
  .btn.primary:hover{filter:brightness(1.07); color:#140f06}
  .btn.sm{padding:5px 11px; font-size:12px}
  .btn.icon{padding:5px 9px}
  .btn:disabled{opacity:.45; cursor:not-allowed}

  nav.side{border-right:1px solid var(--line); overflow:auto; padding:14px 10px 30px}
  .grp{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:18px 10px 6px}
  .grp:first-child{margin-top:4px}
  nav.side button{display:flex; width:100%; justify-content:space-between; align-items:center; gap:8px; text-align:left;
    padding:8px 10px; border-radius:10px; border:0; background:none; cursor:pointer; color:var(--mist)}
  nav.side button:hover{background:var(--panel-2); color:var(--ink)}
  nav.side button[aria-current="true"]{background:var(--panel-2); color:var(--ink); box-shadow:inset 2px 0 0 var(--gold)}
  nav.side .cnt{font-family:var(--mono); font-size:11px; color:var(--mist)}
  .mobile-nav{display:none}

  main.form{overflow:auto; padding:26px 28px 80px}
  .form-in{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
  .form-in h1{margin:0; font-size:24px; font-weight:800}
  .hint{color:var(--mist); font-size:13.5px}
  .hint code{font-family:var(--mono); font-size:12.5px; color:var(--gold-hi); background:rgba(214,178,102,.1); padding:1px 6px; border-radius:6px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:14px}
  .card-h{display:flex; align-items:center; gap:8px}
  .card-h .num{font-family:var(--mono); font-size:12px; color:var(--gold); flex:none}
  .card-h .ttl{font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; cursor:pointer}
  .card-h .tools{display:flex; gap:6px; flex:none}
  .card.closed > :not(.card-h){display:none}
  .field{display:flex; flex-direction:column; gap:6px; min-width:0}
  .field > label{font-size:13px; font-weight:600; color:var(--mist)}
  .field .sub{font-size:12px; color:var(--mist); opacity:.8}
  .row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px}
  input[type=text],input[type=url],input[type=number],input[type=password],textarea{
    width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line-2); background:#0a1110; outline:none}
  input:focus,textarea:focus{border-color:var(--gold)}
  textarea{min-height:84px; resize:vertical}
  .empty input,.empty textarea{border-style:dashed; border-color:rgba(214,178,102,.5)}
  .bad input{border-color:var(--err)}
  .chk{display:flex; align-items:center; gap:8px; font-size:14px}
  .strings{display:flex; flex-direction:column; gap:8px}
  .strings .it{display:flex; gap:8px; align-items:flex-start}
  .strings .it > :first-child{flex:1; min-width:0}
  .add{align-self:flex-start}
  .img-field{display:flex; gap:12px; align-items:center}
  .img-field img{width:64px; height:64px; border-radius:50%; object-fit:cover; border:1px solid var(--line-2); background:#0a1110; flex:none}
  .img-field .grow{flex:1; display:flex; flex-direction:column; gap:8px; min-width:0}

  aside.preview{border-left:1px solid var(--line); display:flex; flex-direction:column; min-width:0; background:#05080a}
  .pv-bar{display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px; color:var(--mist)}
  .pv-bar .btn{margin-left:auto}
  .pv-wrap{flex:1; overflow:auto; display:flex; justify-content:center}
  .pv-wrap iframe{border:0; width:100%; height:100%; background:#05080a}
  .pv-wrap.phone iframe{width:390px; max-width:100%}

  .toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--panel-2); border:1px solid var(--line-2); border-radius:14px; padding:10px 14px; display:flex; gap:12px; align-items:center;
    transition:.25s; z-index:50; max-width:calc(100vw - 32px)}
  .toast.on{opacity:1; transform:translateX(-50%)}
  .note-box{border:1px solid rgba(214,178,102,.35); background:rgba(214,178,102,.06); border-radius:14px; padding:14px 16px; font-size:13.5px; color:#d9cfb8}
  .note-box b{color:var(--gold-hi)}
  .note-box ol{margin:6px 0 0; padding-left:20px}
  /* статистика */
  .seg{display:inline-flex; gap:4px; padding:4px; border:1px solid var(--line-2); border-radius:999px}
  .seg button{border:0; background:none; color:var(--mist); padding:6px 12px; border-radius:999px; cursor:pointer; font:inherit; font-size:13px}
  .seg button[aria-pressed="true"]{background:var(--gold); color:#140f06; font-weight:700}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
  .kpi b{display:block; font-size:26px; font-variant-numeric:tabular-nums; line-height:1.15}
  .kpi span{font-size:12px; color:var(--mist)}
  .chart{position:relative}
  .chart svg{display:block; width:100%; height:auto; overflow:visible}
  .chart .ax{font:11px var(--mono); fill:var(--mist)}
  .tip{position:absolute; pointer-events:none; background:#0a1110; border:1px solid var(--line-2); border-radius:10px; padding:6px 10px; font-size:12px; white-space:nowrap; transform:translate(-50%,-110%)}
  .tip b{color:var(--ink)} .tip span{color:var(--mist)}
  .brk{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px}
  .brk .card{gap:10px}
  .brk h3{margin:0; font-size:14px}
  .rowv{display:grid; grid-template-columns:minmax(0,1fr) 54px 44px; gap:10px; align-items:center; font-size:13px}
  .rowv .lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rowv .bar{grid-column:1 / -1; height:6px; border-radius:99px; background:rgba(237,232,222,.06); margin-top:-6px}
  .rowv .bar i{display:block; height:100%; border-radius:99px; background:var(--gold)}
  .rowv .v{text-align:right; font-variant-numeric:tabular-nums} .rowv .pc{text-align:right; color:var(--mist); font-variant-numeric:tabular-nums}
  .muted{color:var(--mist); font-size:13px}
  pre.json{margin:0; max-height:300px; overflow:auto; font:12px/1.5 var(--mono); background:#0a1110; border:1px solid var(--line); border-radius:12px; padding:12px; color:var(--mist)}

  @media (max-width:1200px){
    .app{grid-template-columns:230px minmax(0,1fr)}
    aside.preview{position:fixed; inset:0; z-index:40; display:none}
    aside.preview.open{display:flex}
  }
  @media (max-width:760px){
    .app{grid-template-columns:1fr; grid-template-rows:auto auto 1fr}
    nav.side{display:none}
    .mobile-nav{display:block; padding:10px 16px; border-bottom:1px solid var(--line)}
    .mobile-nav select{width:100%; padding:10px 12px; border-radius:12px; background:#0a1110; border:1px solid var(--line-2)}
    main.form{padding:18px 16px 90px}
    .status span{display:none}
    header{flex-wrap:wrap}
  }
  @media (min-width:1201px){ #pv-toggle,#pv-close{display:none} }

  /* экран входа: редактор не показывается и не грузится, пока токен не проверен на GitHub */
  .lock{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:24px 16px; overflow:auto; background:var(--bg)}
  .lock-card{width:min(440px,100%); display:flex; flex-direction:column; gap:16px; background:var(--panel); border:1px solid var(--line);
    border-radius:22px; padding:28px 24px}
  .lock-card .logo svg{width:34px; height:34px; color:var(--gold)}
  .lock-card h1{margin:0; font-size:24px; line-height:1.2}
  .lock-card details{border-top:1px solid var(--line); padding-top:12px}
  .lock-card summary{cursor:pointer; font-size:13px; font-weight:600; color:var(--mist)}
  .lock-card details[open] summary{margin-bottom:12px}
  .lock-card details .field + .field{margin-top:10px}
  .check{display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer}
  .check input{width:18px; height:18px; accent-color:var(--gold)}
  .lock-err{margin:0; color:var(--err); font-size:14px; min-height:0}
  .lock-err:empty{display:none}
  .lock-actions{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .lock-actions a{margin-left:auto; color:var(--mist); font-size:14px}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <header>
    <div class="logo">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"/><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M31 29V62"/><path d="M48 29V62"/><path d="M65 29V62"/><path d="M25 64H71"/></g><circle cx="76" cy="71" r="5" fill="currentColor"/></svg>
      Админка <small>dr__shapovalov</small>
    </div>
    <div class="status" id="status" role="status"><i></i><span id="status-text">Загружаю…</span></div>
    <button class="btn" id="pv-toggle" type="button">Предпросмотр</button>
    <button class="btn primary" id="publish" type="button">Опубликовать</button>
    <button class="btn" id="logout" type="button">Выйти</button>
  </header>
  <div class="mobile-nav"><label class="hint" for="msel">Раздел</label><select id="msel"></select></div>
  <nav class="side" id="side" aria-label="Разделы"></nav>
  <main class="form" id="form"><div class="form-in" id="form-in"></div></main>
  <aside class="preview" id="preview" aria-label="Предпросмотр сайта">
    <div class="pv-bar">Живой предпросмотр
      <button class="btn sm" id="pv-phone" type="button">Телефон</button>
      <button class="btn sm" id="pv-close" type="button">Закрыть</button>
    </div>
    <div class="pv-wrap" id="pv-wrap"><iframe id="pv" title="Сайт" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe></div>
  </aside>
</div>
<div class="lock" id="lock" hidden>
  <form class="lock-card" id="lock-form" autocomplete="on">
    <div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"/><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M31 29V62"/><path d="M48 29V62"/><path d="M65 29V62"/><path d="M25 64H71"/></g><circle cx="76" cy="71" r="5" fill="currentColor"/></svg> dr__shapovalov</div>
    <h1>Вход в админку</h1>
    <p class="hint">Редактировать сайт может только владелец. Войдите своим токеном GitHub: тем, у которого есть право записи в репозиторий сайта. Токен проверяется прямо на GitHub.</p>
    <input type="text" name="username" autocomplete="username" value="dr-shapovalov-admin" hidden>
    <div class="field"><label for="lk-token">Токен GitHub</label>
      <input id="lk-token" type="password" autocomplete="current-password" spellcheck="false" required></div>
    <label class="check"><input type="checkbox" id="lk-remember"> Запомнить на этом устройстве</label>
    <details id="lk-repo"><summary>Репозиторий сайта</summary>
      <div class="field"><label for="lk-owner">Владелец</label><input id="lk-owner" type="text" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label for="lk-name">Репозиторий</label><input id="lk-name" type="text" autocomplete="off" spellcheck="false"></div>
    </details>
    <p class="lock-err" id="lk-err" role="alert"></p>
    <div class="lock-actions">
      <button class="btn primary" type="submit" id="lk-go">Войти</button>
      <button class="btn" type="button" id="lk-local" hidden>Открыть без входа</button>
      <a href="./">← На сайт</a>
    </div>
  </form>
</div>
<div class="toast" id="toast" role="status"><span id="toast-text"></span><button class="btn sm" id="toast-undo" type="button" hidden>Вернуть</button></div>

<script>
(() => {
  /* ---------- защита от встраивания ----------
     Админку нельзя открывать внутри чужой страницы: так её кнопки можно было бы
     нажать обманом (clickjacking). Внутри своего же сайта — можно. */
  const framedByOther = (() => { if (window.top === window.self) return false; try { return !window.top.location.href; } catch (e) { return true; } })();
  if (framedByOther) {
    document.body.textContent = 'Админка открывается только напрямую, не внутри другой страницы: ' + location.href;
    return;
  }
  /* ---------- схема: какие поля в каком разделе ---------- */
  const F = (k, l, t = 'text', extra = {}) => ({ k, l, t, ...extra });
  const SCHEMA = [
    { g: 'Главная' },
    { id: 'hero', title: 'Первый экран', path: 'hero', fields: [
      F('firstName', 'Имя'), F('middleName', 'Отчество'), F('lastName', 'Фамилия'), F('lede', 'Текст под именем — для родителей', 'area'),
      F('ledePro', 'Текст под именем — для коллег', 'area', { sub: 'Показывается, когда посетитель выбрал «Коллегам»' }),
      F('cardLine1', 'Карточка у фото, строка 1'), F('cardLine2', 'Карточка у фото, строка 2'), F('portrait', 'Фото в кружке', 'image', { sub: 'Показывается, если нет фото без фона' }),
      F('figure', 'Фото без фона на первом экране', 'image', { sub: 'PNG или WebP с прозрачным фоном, вертикальное. Пусто — будет фото в кружке' })] },
    { id: 'readings', title: 'Цифры под первым экраном', path: 'readings', list: true, item: 'Цифра', titleKey: 'label', fields: [
      F('from', 'Было (необязательно)', 'text', { sub: 'Например 7,93 — тогда покажется «7,93 → 2»' }), F('to', 'Значение'), F('unit', 'Единица'), F('label', 'Подпись')] },
    { id: 'audience', title: 'Переключатель «Родителям / Коллегам»', path: 'audience', fields: [
      F('parentsLabel', 'Кнопка для родителей'), F('colleaguesLabel', 'Кнопка для коллег')] },
    { id: 'ctaParents', title: 'Главная кнопка: для родителей', path: 'audience.parentsCta', fields: [
      F('label', 'Текст'), F('link', 'Куда ведёт', 'text', { sub: 'Например #distraction' })] },
    { id: 'ctaColleagues', title: 'Главная кнопка: для коллег', path: 'audience.colleaguesCta', fields: [
      F('label', 'Текст'), F('link', 'Куда ведёт', 'text', { sub: 'Например #science' })] },
    { id: 'distraction', title: 'Схема «Как растёт кость»', path: 'distraction', fields: [
      F('heading', 'Заголовок'), F('intro', 'Вступление для родителей', 'area'), F('introPro', 'Вступление для коллег', 'area'),
      F('maxMm', 'Удлинение на схеме, мм', 'number', { sub: 'Только для схемы' }), F('note', 'Примечание под схемой', 'area')] },
    { id: 'dxPhases', title: 'Схема: этапы', path: 'distraction.phases', list: true, item: 'Этап', titleKey: 'title', fields: [
      F('title', 'Название для родителей'), F('text', 'Текст для родителей', 'area'), F('titlePro', 'Название для коллег'), F('textPro', 'Текст для коллег', 'area')] },
    { id: 'meta', title: 'Ссылки в шапке', path: 'meta', fields: [F('handle', 'Ник в шапке'), F('telegram', 'Telegram', 'url'), F('instagram', 'Instagram', 'url'),
      F('metrika', 'Номер счётчика Яндекс Метрики', 'text', { sub: 'Только цифры, например 98765432. Пусто — посещения не считаются. Подробнее — в разделе «Статистика»' })] },
    { g: 'Обо мне' },
    { id: 'about', title: 'О себе', path: 'about', fields: [F('heading', 'Заголовок'), F('text', 'Текст', 'area')] },
    { id: 'facts', title: 'Факты', path: 'about.facts', list: true, item: 'Факт', titleKey: 'label', fields: [F('label', 'Название'), F('value', 'Значение')] },
    { id: 'education', title: 'Образование', path: 'about.education', list: true, item: 'Ступень', titleKey: 'degree', fields: [F('years', 'Годы'), F('degree', 'Что окончил'), F('place', 'Вуз или организация')] },
    { id: 'reviews', title: 'Отзывы: текст', path: 'reviews', fields: [F('heading', 'Заголовок', 'text', { sub: '*слово* — выделить золотом' }), F('text', 'Пояснение', 'area')] },
    { id: 'reviewLinks', title: 'Отзывы: площадки', path: 'reviews.links', list: true, item: 'Площадка', titleKey: 'label', fields: [
      F('label', 'Название', 'text', { sub: 'ПроДокторов, Яндекс…' }), F('note', 'Подпись сверху'), F('url', 'Ссылка на вашу страницу с отзывами', 'url')] },
    { id: 'courses', title: 'Курсы', path: 'about.courses', list: true, item: 'Курс', titleKey: 'title', fields: [F('year', 'Год'), F('title', 'Название курса'), F('org', 'Где проходил')] },
    { g: 'Работа' },
    { id: 'directions', title: 'Направления', path: 'directions', list: true, item: 'Направление', titleKey: 'title', fields: [
      F('code', 'Короткий код', 'text', { sub: 'Три-четыре буквы сверху карточки' }), F('title', 'Название'), F('text', 'Описание', 'area'),
      F('linkLabel', 'Текст ссылки'), F('link', 'Куда ведёт', 'text', { sub: 'Например #case-1 или https://…' })] },
    { id: 'cases', title: 'Клинические случаи', path: 'cases', list: true, item: 'Случай', titleKey: 'title', fields: [
      F('title', 'Заголовок'), F('id', 'Метка для ссылок', 'text', { sub: 'Латиницей, например case-3' }),
      F('tags', 'Ярлыки', 'strings', { sub: 'Первый ярлык подсвечивается золотом' }),
      F('points', 'Пункты', 'strings', { area: true }),
      F('metric', 'Главная цифра', 'text', { sub: 'Например 21 или 7,93 → 2' }), F('metricUnit', 'Единица'), F('metricCaption', 'Подпись под цифрой'),
      F('scaleMax', 'Конец шкалы', 'number', { sub: 'Самое большое значение на оси' }),
      F('bars', 'Полосы графика', 'sublist', { item: 'Полоса', fields: [F('name', 'Название'), F('value', 'Значение', 'number'), F('unit', 'Единица'), F('accent', 'Выделить золотом', 'bool')] }),

    return el('div', { className: 'card' }, el('b', {}, 'Вход в Метрику — один раз настроить'),
      el('ol', { className: 'hint', style: 'margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px' },
        el('li', {}, 'Откройте oauth.yandex.ru/client/new (кнопка ниже) и создайте приложение «Админка сайта», платформа «Веб-сервисы».'),
        el('li', {}, 'Redirect URI: ', el('code', {}, back)),
        el('li', {}, 'Доступ: «Яндекс Метрика» → «Получение статистики, чтение параметров своих и доверенных счётчиков».'),
        el('li', {}, 'Скопируйте ClientID приложения сюда и нажмите «Войти через Яндекс».')),
      el('div', { style: 'display:flex; gap:10px; flex-wrap:wrap' }, el('a', { className: 'btn', href: 'https://oauth.yandex.ru/client/new', target: '_blank', rel: 'noopener' }, 'Создать приложение ↗')),
      el('div', { className: 'field' }, el('label', { htmlFor: 'ym-cid' }, 'ClientID приложения'),
        el('input', { id: 'ym-cid', type: 'text', value: cid, autocomplete: 'off', spellcheck: false, on: { input: (e) => { cid = e.target.value.trim(); } } })),
      el('div', {}, el('button', { type: 'button', className: 'btn primary', on: { click: go } }, 'Войти через Яндекс')),
      el('details', {}, el('summary', { className: 'hint' }, 'Уже есть токен Метрики? Вставить вручную'),
        el('div', { className: 'field', style: 'margin-top:8px' }, el('input', { type: 'password', autocomplete: 'off', on: { input: (e) => { pasted = e.target.value.trim(); } } }),
          el('div', {}, el('button', { type: 'button', className: 'btn sm', on: { click: () => { if (pasted) { ymTok.set(pasted); renderForm(); } } } }, 'Сохранить на время вкладки')))));
  }
  async function loadStats(id, tok, out, dash) {
    const panel = (title, dims, metric, map) => ({ title, dims, metric, map });
    const parts = [
      panel('Откуда приходят', 'ym:s:lastTrafficSource', 'ym:s:visits'),
      panel('С каких сайтов', 'ym:s:lastReferalSource', 'ym:s:visits'),
      panel('Поисковые системы', 'ym:s:lastSearchEngine', 'ym:s:visits'),
      panel('Соцсети и мессенджеры', 'ym:s:lastSocialNetwork', 'ym:s:visits'),
      panel('Города', 'ym:s:regionCity', 'ym:s:visits'),
      panel('Страны', 'ym:s:regionCountry', 'ym:s:visits'),
      panel('Устройства', 'ym:s:deviceCategory', 'ym:s:visits'),
      panel('Браузеры', 'ym:s:browser', 'ym:s:visits'),
      panel('Разделы сайта', 'ym:pv:URL', 'ym:pv:pageviews', (u) => { const h = (String(u).split('#')[1] || 'top'); return TAB_NAMES[h] || '#' + h; }),
    ];
    let total, daily;
    try {
      [total, daily] = await Promise.all([
        ymQuery(id, tok, 'ym:s:visits,ym:s:users,ym:s:pageviews,ym:s:bounceRate,ym:s:avgVisitDurationSeconds,ym:s:percentNewVisitors', ''),
        ymQuery(id, tok, 'ym:s:visits,ym:s:users', 'ym:s:date', { sort: 'ym:s:date', limit: '100' })]);
    } catch (e) {
      out.innerHTML = '';
      const why = e instanceof TypeError
        ? 'браузер не пустил запрос к Метрике (api-metrika.yandex.net) напрямую из админки — ' + e.message
        : `Метрика ответила ${e.status}: ${e.message}` + (e.status === 403 ? '. Обычно это значит: у приложения на oauth.yandex.ru не отмечен доступ «Получение статистики…», или вы вошли не тем Яндекс-аккаунтом, которому принадлежит счётчик ' + id + '.' : e.status === 401 ? '. Токен не подошёл — войдите заново.' : '');
      ymErr.set(why);
      if (e.status === 401 || e.status === 403) { ymTok.set(''); renderForm(); return; }
      out.append(el('div', { className: 'note-box', style: 'border-color:var(--err)' }, el('b', { style: 'color:var(--err)' }, 'Не удалось получить статистику: '), why),
        el('a', { className: 'btn primary', href: dash, target: '_blank', rel: 'noopener' }, 'Открыть в Метрике ↗'));
      return;
    }
    out.innerHTML = ''; ymErr.set('');
    const t = (total.totals || []);
    const dur = t[4] || 0;
    out.append(el('div', { className: 'kpis' }, ...[
      [fmt(t[0] || 0), 'визиты'], [fmt(t[1] || 0), 'посетители'], [fmt(t[2] || 0), 'просмотры страниц'],
      [(t[3] || 0).toFixed(1).replace('.', ',') + '%', 'отказы'], [`${Math.floor(dur / 60)}:${String(Math.round(dur % 60)).padStart(2, '0')}`, 'время на сайте, мин:с'],
      [(t[5] || 0).toFixed(0) + '%', 'новые посетители']].map(([v, l]) => el('div', { className: 'kpi' }, el('b', {}, v), el('span', {}, l)))));
    out.append(el('div', { className: 'card' }, el('b', {}, `Визиты по дням, последние ${ymDays} дней`), chart(daily)));
    const brk = el('div', { className: 'brk' }); out.append(brk);
    await Promise.all(parts.map(async (p) => {
      const card = el('div', { className: 'card' }, el('h3', {}, p.title), el('p', { className: 'muted' }, 'Загружаю…')); brk.append(card);
      try {
        const r = await ymQuery(id, tok, p.metric, p.dims, { sort: '-' + p.metric });
        const rows = (r.data || []).map((d) => [p.map ? p.map(d.dimensions[0].name) : (d.dimensions[0].name || 'не определено'), d.metrics[0]]);
        // одинаковые разделы (разные адреса одной вкладки) складываем
        const agg = new Map(); rows.forEach(([k, v]) => agg.set(k, (agg.get(k) || 0) + v));
        const list = [...agg].sort((a, b) => b[1] - a[1]), sum = (r.totals || [])[0] || list.reduce((a, x) => a + x[1], 0), max = list[0] ? list[0][1] : 1;
        card.lastChild.replaceWith(list.length ? el('div', { style: 'display:flex; flex-direction:column; gap:10px' }, ...list.map(([k, v]) =>
          el('div', { className: 'rowv' }, el('span', { className: 'lbl', title: k }, k), el('span', { className: 'v' }, fmt(v)), el('span', { className: 'pc' }, sum ? Math.round(v / sum * 100) + '%' : ''),
            el('span', { className: 'bar' }, el('i', { style: `width:${Math.max(2, v / max * 100).toFixed(1)}%` }))))) : el('p', { className: 'muted' }, 'Пока нет данных'));
      } catch (e) { card.lastChild.replaceWith(el('p', { className: 'muted' }, 'Нет данных: ' + e.message)); }
    }));
  }
  function chart(daily) {
    const rows = (daily.data || []).map((d) => ({ day: d.dimensions[0].name, v: d.metrics[0], u: d.metrics[1] }));
    if (!rows.length) return el('p', { className: 'muted' }, 'Пока нет визитов за этот период');
    const NS = 'http://www.w3.org/2000/svg', W = 600, H = 160, pad = 18, n = rows.length, bw = (W - 2) / n, max = Math.max(1, ...rows.map((r) => r.v));
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H + pad}`);
    svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Визиты по дням: ' + rows.map((r) => `${r.day} — ${r.v}`).join(', '));
    const mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };
    svg.append(mk('line', { x1: 0, x2: W, y1: H, y2: H, stroke: 'rgba(237,232,222,.2)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }));
    const wrap = el('div', { className: 'chart' }), tip = el('div', { className: 'tip', hidden: true });
    rows.forEach((r, i) => {
      const h = Math.max(r.v ? 2 : 0, r.v / max * (H - 8)), x = i * bw + 1, w = Math.max(1, bw - 2), y = H - h, rr = Math.min(4, w / 2, h);
      if (h) svg.append(mk('path', { d: `M${x},${H} V${y + rr} Q${x},${y} ${x + rr},${y} H${x + w - rr} Q${x + w},${y} ${x + w},${y + rr} V${H} Z`, fill: '#d6b266' }));
      const hit = mk('rect', { x: i * bw, y: 0, width: bw, height: H, fill: 'transparent' });
      hit.addEventListener('pointerenter', () => { const d = new Date(r.day); tip.hidden = false;
        tip.replaceChildren(el('b', {}, `${fmt(r.v)} визитов`), el('br'), el('span', {}, `${d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })} · ${fmt(r.u)} посетителей`));
        tip.style.left = ((i + 0.5) / n * 100) + '%'; tip.style.top = (y / (H + pad) * 100) + '%'; });
      hit.addEventListener('pointerleave', () => { tip.hidden = true; });
      svg.append(hit);
    });
    const lab = (i, anchor) => { const d = new Date(rows[i].day); const t = mk('text', { x: anchor === 'end' ? W : anchor === 'start' ? 0 : (i + 0.5) * bw, y: H + 14, 'text-anchor': anchor, class: 'ax' });
      t.textContent = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); return t; };
    svg.append(lab(0, 'start'), lab(n - 1, 'end'));
    const maxT = mk('text', { x: 0, y: 10, class: 'ax' }); maxT.textContent = 'макс. ' + fmt(max) + ' в день'; svg.append(maxT);
    wrap.append(svg, tip); return wrap;
  }

  /* ---------- публикация на GitHub ---------- */
  function renderPublish(box) {
    const gh = ghConf();
    const f = (k, l, t = 'text', sub) => { const w = el('div', { className: 'field' }, el('label', { htmlFor: 'gh-' + k }, l),
      el('input', { id: 'gh-' + k, type: t, value: gh[k] || '', autocomplete: 'off', on: { input: (e) => { gh[k] = e.target.value.trim(); store.set(GH, gh); } } }));
      if (sub) w.append(el('span', { className: 'sub' }, sub)); return w; };
    box.append(el('div', { className: 'note-box' }, el('b', {}, 'Как это работает. '),
      'Весь текст сайта лежит в одном файле content.json. Кнопка «Опубликовать» записывает его в ваш репозиторий на GitHub, а хостинг (GitHub Pages) через минуту показывает новую версию сайта.',
      el('ol', {}, el('li', {}, 'На GitHub: Settings → Developer settings → Fine-grained tokens → Generate new token.'),
        el('li', {}, 'Repository access: только репозиторий сайта. Permissions → Contents: Read and write.'),
        el('li', {}, 'Токен вводится на экране входа. Он хранится только в этом браузере и никуда, кроме GitHub, не отправляется. Кнопка «Выйти» стирает его.'))));
    const card = el('div', { className: 'card' }, el('div', { className: 'row' }, f('owner', 'Владелец репозитория'), f('repo', 'Репозиторий'), f('branch', 'Ветка')),
      f('dir', 'Папка сайта в репозитории', 'text', 'Пусто, если сайт лежит в корне. Например: site'),
      el('div', { style: 'display:flex; gap:10px; flex-wrap:wrap' },
        el('button', { type: 'button', className: 'btn', on: { click: testGh } }, 'Проверить подключение'),
        el('button', { type: 'button', className: 'btn', on: { click: logout } }, 'Выйти и стереть токен')));
    const json = el('pre', { className: 'json' }, JSON.stringify(data, null, 2));
    const backup = el('div', { className: 'card' }, el('b', {}, 'Без GitHub'),
      el('p', { className: 'hint' }, 'Скопируйте весь текст сайта и замените им файл content.json на хостинге.'),
      el('div', { style: 'display:flex; gap:10px; flex-wrap:wrap' },
        el('button', { type: 'button', className: 'btn', on: { click: copyJson } }, 'Скопировать content.json'),
        el('button', { type: 'button', className: 'btn', on: { click: () => { undoSnap = structuredClone(data); data = JSON.parse(published); renderNav(); renderForm(); dirty(); toast('Черновик сброшен', true); } } }, 'Сбросить черновик')),
      json);
    box.append(card, backup);
  }
  const ghCfg = () => { const g = ghConf(), token = tokenGet(); return g.owner && g.repo && token ? { ...g, token } : null; };
  const ghPath = (g, p) => [g.dir, p].filter(Boolean).join('/').replace(/\/+/g, '/');
  async function gh(g, method, path, body) {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}${method === 'GET' ? `?ref=${encodeURIComponent(g.branch || 'main')}` : ''}`,
      { method, headers: { Authorization: `Bearer ${g.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, body: body && JSON.stringify(body) });
    if (method === 'GET' && r.status === 404) return null;
    if (!r.ok) { const t = await r.json().catch(() => ({})); throw new Error(`${r.status}: ${t.message || r.statusText}`); }
    return r.json();
  }
  const b64 = (str) => { const bytes = new TextEncoder().encode(str); let s = ''; bytes.forEach((b) => { s += String.fromCharCode(b); }); return btoa(s); };
  async function testGh() {
    const g = ghCfg(); if (!g) return toast('Заполните владельца и репозиторий и войдите с токеном');
    try { const f = await gh(g, 'GET', ghPath(g, 'content.json')); toast(f ? 'Подключено: content.json найден' : 'Подключено, но content.json в этой папке нет — он будет создан'); }
    catch (e) { toast('Не получилось: ' + e.message + '. Проверьте токен и название репозитория.'); }
  }
  async function publish() {
    const g = ghCfg(); if (!g) return lockScreen('Чтобы опубликовать, войдите с токеном GitHub.');
    const bad = []; JSON.stringify(data, (k, v) => { if (/(^link$|^url$|telegram|instagram)/.test(k) && typeof v === 'string' && !isUrlOk(v)) bad.push(v); return v; });
    if (bad.length) return toast('Есть ссылка без https:// — исправьте: ' + bad[0]);
    $('publish').disabled = true; setStatus('dirty', 'Публикую…');
    try {
      const path = ghPath(g, 'content.json'), cur = await gh(g, 'GET', path);
      await gh(g, 'PUT', path, { message: 'Обновить содержимое сайта (админка)', content: b64(JSON.stringify(data, null, 2) + '\n'), sha: cur?.sha, branch: g.branch || 'main' });
      published = JSON.stringify(data); dirty(); toast('Опубликовано. Сайт обновится примерно через минуту.');
    } catch (e) { setStatus('err', 'Не опубликовано: ' + e.message); toast('Не опубликовано: ' + e.message); }
    finally { $('publish').disabled = false; }
  }
  async function upload(file, obj, key, txt, img) {
    if (!file) return; const g = ghCfg();
    if (!g) return lockScreen('Чтобы загрузить фото, войдите с токеном GitHub.');
    if (file.size > 4e6) return toast('Файл больше 4 МБ — уменьшите фото');
    // только настоящие JPEG, PNG и WebP: проверяем и расширение, и первые байты файла
    const ext = (file.name.toLowerCase().match(/\.(jpe?g|png|webp)$/) || [])[1];
    const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    const isJpg = head[0] === 0xff && head[1] === 0xd8 && head[2] === 0xff;
    const isPng = [0x89, 0x50, 0x4e, 0x47].every((b, i) => head[i] === b);
    const isWebp = String.fromCharCode(...head.slice(0, 4)) === 'RIFF' && String.fromCharCode(...head.slice(8, 12)) === 'WEBP';
    if (!ext || !(isJpg || isPng || isWebp)) return toast('Можно загружать только фото JPEG, PNG или WebP');
    const base = file.name.toLowerCase().replace(/\.[a-z0-9]+$/, '').replace(/[^a-z0-9\-_]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'photo';
    const name = 'img/' + base + '.' + (isJpg ? 'jpg' : isPng ? 'png' : 'webp');
    const content = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.readAsDataURL(file); });
    try {
      const path = ghPath(g, name), cur = await gh(g, 'GET', path);
      await gh(g, 'PUT', path, { message: `Загрузить ${name} (админка)`, content, sha: cur?.sha, branch: g.branch || 'main' });
      obj[key] = name; txt.value = name; img.src = URL.createObjectURL(file); dirty();
      toast('Фото загружено. Нажмите «Опубликовать», чтобы оно появилось на сайте.');
    } catch (e) { toast('Фото не загрузилось: ' + e.message); }
  }
  async function copyJson() {
    const text = JSON.stringify(data, null, 2);
    try { await navigator.clipboard.writeText(text); toast('Скопировано'); }
    catch (e) { const pre = document.querySelector('pre.json'); const r = document.createRange(); r.selectNodeContents(pre); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Текст выделен — нажмите Ctrl+C или «Копировать»'); }
  }
  $('publish').addEventListener('click', publish);

  /* ---------- предпросмотр ---------- */
  let pvT; const pv = $('pv');
  function schedulePreview() { clearTimeout(pvT); pvT = setTimeout(() => { try { pv.contentWindow.postMessage({ type: 'shapovalov:content', content: data }, '*'); /* предпросмотр изолирован: его происхождение «пустое», а черновик не секретный */ } catch (e) {} }, 250); }
  addEventListener('message', (e) => { if (e.source === pv.contentWindow && e.data && e.data.type === 'shapovalov:ready') schedulePreview(); });
  pv.addEventListener('load', schedulePreview);
  $('pv-phone').addEventListener('click', (e) => { const w = $('pv-wrap'); w.classList.toggle('phone'); e.target.textContent = w.classList.contains('phone') ? 'Компьютер' : 'Телефон'; });
  $('pv-toggle').addEventListener('click', () => { $('preview').classList.add('open'); schedulePreview(); });
  $('pv-close').addEventListener('click', () => $('preview').classList.remove('open'));
  addEventListener('beforeunload', (e) => { if (data && JSON.stringify(data) !== published) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------- вход ---------- */
  // Сайт статический, поэтому сам файл admin.html открыть может любой, кто знает адрес.
  // Защита — токен: редактор не показывается без токена, у которого есть право записи в репозиторий,
  // а опубликовать что-либо без такого токена невозможно — GitHub не примет запись.
  const local = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  async function verify(g, token) {
    let r;
    try { r = await fetch(`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}`,
      { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, cache: 'no-store' }); }
    catch (e) { throw new Error('нет связи с GitHub. Проверьте интернет и попробуйте снова.'); }
    if (r.status === 401) throw new Error('GitHub не принял токен: он неверный, отозван или просрочен.');
    if (r.status === 403 || r.status === 404) throw new Error(`репозиторий ${g.owner}/${g.repo} не найден или этот токен к нему не допущен.`);
    if (!r.ok) throw new Error(`GitHub ответил ${r.status}.`);
    const j = await r.json();
    if (!(j.permissions && j.permissions.push)) throw new Error('у этой учётной записи нет права записи в репозиторий сайта.');
  }
  let started = false;
  function lockScreen(msg) {
    const g = ghConf();
    $('lk-owner').value = g.owner; $('lk-name').value = g.repo;
    $('lk-err').textContent = msg || ''; $('lk-local').hidden = !local;
    $('lk-remember').closest('label').hidden = sharedHost;
    $('app').hidden = true; $('lock').hidden = false; $('lk-token').focus();
  }
  function unlock() { $('lock').hidden = true; $('app').hidden = false; if (!started) { started = true; start(); } }
  function logout() {
    tokenSet(''); toast('Вы вышли. Токен стёрт из этого браузера.');
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    lockScreen();
  }
  $('logout').addEventListener('click', logout);
  $('lk-local').addEventListener('click', () => { unlock(); toast('Локальная копия: править можно, опубликовать — только после входа с токеном.'); });
  $('lock-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = $('lk-token').value.trim(), g = { ...ghConf(), owner: $('lk-owner').value.trim(), repo: $('lk-name').value.trim() };
    if (!token) return;
    $('lk-go').disabled = true; $('lk-err').textContent = ''; $('lk-go').textContent = 'Проверяю…';
    try {
      await verify(g, token);
      store.set(GH, { owner: g.owner, repo: g.repo, branch: g.branch, dir: g.dir });
      tokenSet(token, $('lk-remember').checked); $('lk-token').value = ''; unlock();
    } catch (err) { $('lk-err').textContent = 'Не удалось войти: ' + err.message; if (!/токен/.test(err.message)) $('lk-repo').open = true; }
    finally { $('lk-go').disabled = false; $('lk-go').textContent = 'Войти'; }
  });
  (async () => {
    const token = tokenGet();
    if (!token) return lockScreen();
    try { await verify(ghConf(), token); unlock(); }
    catch (err) { if (/GitHub не принял|нет права|не допущен/.test(err.message)) tokenSet(''); lockScreen('Нужно войти заново: ' + err.message); }
  })();

  /* ---------- старт редактора (только после входа) ---------- */
  function start() {
  pv.src = 'index.html#preview';
  fetch('content.json', { cache: 'no-store' }).then((r) => r.json()).then((c) => {
    published = JSON.stringify(c); data = c;
    const d = store.get(DRAFT);
    if (d && d.data && JSON.stringify(d.data) !== published) {
      data = d.data; toast(`Открыт черновик от ${new Date(d.at).toLocaleString('ru-RU')}. Опубликуйте его или сбросьте в разделе «Публикация».`);
    }
    renderNav(); renderForm(); dirty();
  }).catch(() => setStatus('err', 'Не удалось загрузить content.json. Админка должна лежать рядом с сайтом на хостинге.'));
  }
})();
